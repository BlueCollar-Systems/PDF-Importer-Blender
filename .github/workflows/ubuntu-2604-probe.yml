# Temporary image probe. Not part of the fix. Deleted after the 26.04 run.
# Exercises the Ubuntu jobs that do not start on pull_request, without
# minting a release or sending a website dispatch.
name: ubuntu-2604-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Warn-only stranded-release audit
        run: |
          set -e
          VERSION=$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("pdf_vector_importer/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'"version":\s*\((\d+),\s*(\d+),\s*(\d+)\)', text)
          if not match:
              raise SystemExit("Could not parse version tuple from pdf_vector_importer/__init__.py")
          print(".".join(match.groups()))
          PY
          )
          TAG="v${VERSION}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::Tag ${TAG} does not exist yet — version was bumped; auto-release owns minting. Nothing stranded to audit."
            exit 0
          fi
          python scripts/release_safety.py audit-existing-tag \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --before "${{ github.event.before }}" \
            --head "${GITHUB_SHA}" \
            --session-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --mode report \
            --summary "$GITHUB_STEP_SUMMARY" \
            --warnings-file .release-safety/warnings.json

  notify-website:
    runs-on: ubuntu-26.04
    steps:
      - name: Check dispatch token secret
        id: token_check
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no token configured)
        if: steps.token_check.outputs.has_token != 'true'
        run: |
          echo "::warning::Skipping website dispatch because no valid dispatch token secret is configured."
          echo "Set WEBSITE_DISPATCH_TOKEN (or BLUECOLLAR_WEBSITE_DISPATCH_TOKEN / REPO_DISPATCH_TOKEN) to enable cross-repo dispatch."

      - name: github-script runtime on this image
        uses: actions/github-script@v9
        with:
          script: |
            core.info('ubuntu-26.04 probe: github-script ran. Website dispatch was not sent.')

  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run release gate tests on selected source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "PyMuPDF>=1.28.2,<2.0" "fonttools==4.60.2" pytest
          python pdfcadcore_sync_check.py --skip-cross-repo
          python -m pytest tests/ -q --basetemp "$RUNNER_TEMP/pytest-blender"
          python tests/test_release_safety.py

      - name: Build release
        env:
          BC_RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: python build_release.py

      - name: Smoke shipped add-on ZIP
        run: python scripts/smoke_release_zip.py "dist/Blender-PDF-Importer_*.zip"

  publish-tools:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publisher tools present
        run: |
          python --version
          gh --version
          git --version
