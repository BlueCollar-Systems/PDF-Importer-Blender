name: auto-release

on:
  # Publishing is explicit after source and native acceptance finish.
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified releases after all current work is complete
        type: boolean
        required: true
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      action: ${{ steps.release_plan.outputs.action }}
      tag: ${{ steps.release_plan.outputs.tag }}
      release_target: ${{ steps.release_plan.outputs.release_target }}
      release_id: ${{ steps.release_plan.outputs.release_id }}
      build_ref: ${{ steps.release_plan.outputs.build_ref }}
      candidate_artifact: ${{ steps.candidate.outputs.artifact_name }}
      candidate_run_attempt: ${{ steps.candidate.outputs.run_attempt }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # GITHUB_TOKEN always authenticates checkout; RELEASE_BUMP_TOKEN is used
          # only when pushing the version-bump commit past branch protection.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read committed version
        id: version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          init_file = pathlib.Path("pdf_vector_importer/__init__.py")
          pyproject = pathlib.Path("pyproject.toml")

          init_text = init_file.read_text(encoding="utf-8")
          match = re.search(r'("version":\s*\()(\d+),\s*(\d+),\s*(\d+)(\))', init_text)
          if not match:
              raise SystemExit('Could not parse version tuple from pdf_vector_importer/__init__.py')

          major, minor, patch = map(int, match.groups()[1:4])
          version = f"{major}.{minor}.{patch}"

          pyproject_text = pyproject.read_text(encoding="utf-8")
          pyproject_match = re.search(r'^version\s*=\s*"(\d+\.\d+\.\d+)"', pyproject_text, re.MULTILINE)
          if not pyproject_match or pyproject_match.group(1) != version:
              got = pyproject_match.group(1) if pyproject_match else "missing"
              raise SystemExit(f"Version mismatch: core={version} pyproject={got}")

          # RB-22: README badge is a quick-card §4.2 bump site — gate it too
          # (same pattern as FreeCAD/SketchUp auto-release).
          readme_text = pathlib.Path("README.md").read_text(encoding="utf-8")
          badge_match = re.search(r"Version-(\d+\.\d+\.\d+)-(?:green|blue)\.svg", readme_text)
          if not badge_match or badge_match.group(1) != version:
              got = badge_match.group(1) if badge_match else "missing"
              raise SystemExit(f"Version mismatch: core={version} README badge={got}")

          legacy_init = pathlib.Path("blender_pdf_vector_importer/__init__.py")
          if legacy_init.exists():
              legacy_text = legacy_init.read_text(encoding="utf-8")
              legacy_match = re.search(r'("version":\s*\()(\d+),\s*(\d+),\s*(\d+)(\))', legacy_text)
              if not legacy_match:
                  raise SystemExit("Could not parse version tuple from blender_pdf_vector_importer/__init__.py")
              legacy_version = ".".join(legacy_match.groups()[1:4])
              if legacy_version != version:
                  raise SystemExit(f"Version mismatch: core={version} legacy={legacy_version}")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"version={version}\n", encoding="utf-8")
          PY

      - name: Plan atomic release completion
        id: release_plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          cp scripts/release_safety.py "$RUNNER_TEMP/release_safety.py"
          TAG_SHA="$(git rev-list -n 1 "$TAG^{commit}" 2>/dev/null || true)"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          DISCOVERY="$(python "$RUNNER_TEMP/release_safety.py" discover-release \
            --releases-json "$RUNNER_TEMP/releases.json" --tag "$TAG")"
          RELEASE_STATE="$(printf '%s' "$DISCOVERY" | jq -r .release_state)"
          RELEASE_ID="$(printf '%s' "$DISCOVERY" | jq -r .release_id)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          else
            printf '%s\n' '{"assets":[]}' > "$RUNNER_TEMP/release.json"
          fi
          python "$RUNNER_TEMP/release_safety.py" plan-release \
            --version "${{ steps.version.outputs.version }}" \
            --head-sha "$GITHUB_SHA" \
            --tag-sha "$TAG_SHA" \
            --release-state "$RELEASE_STATE" \
            --github-output "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release source
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.release_plan.outputs.build_ref }}"
          test "$(git rev-parse HEAD)" = "${{ steps.release_plan.outputs.build_ref }}"

      - name: Run release gate tests on selected source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "PyMuPDF>=1.28.2,<2.0" "fonttools==4.60.2" pytest
          python pdfcadcore_sync_check.py --skip-cross-repo
          python -m pytest tests/ -q --basetemp "$RUNNER_TEMP/pytest-blender"
          python tests/test_release_safety.py

      - name: Build release
        env:
          BC_RELEASE_SOURCE_SHA: ${{ steps.release_plan.outputs.build_ref }}
        run: python build_release.py

      - name: Smoke shipped add-on ZIP
        run: python scripts/smoke_release_zip.py "dist/Blender-PDF-Importer_*.zip"

      - name: Record exact release candidate
        id: candidate
        env:
          BUILD_REF: ${{ steps.release_plan.outputs.build_ref }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["BUILD_REF"]:
              raise SystemExit("Candidate checkout does not match selected source")
          archives = list(Path("dist").glob("Blender-PDF-Importer_*.zip"))
          if len(archives) != 1:
              raise SystemExit("Expected exactly one candidate ZIP")
          archive = archives[0]
          record = {
              "schema": "bcs.blender_release_candidate/1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": actual,
              "workflow_sha": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "version": os.environ["RELEASE_VERSION"],
              "artifact": {
                  "name": archive.name,
                  "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                  "size_bytes": archive.stat().st_size,
              },
          }
          Path("dist/release-candidate-provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"run_attempt={record['run_attempt']}\n")
              output.write(f"artifact_name=attested-release-candidate-{record['run_id']}-{record['run_attempt']}\n")
          PY

      - name: Attest exact release candidate
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/Blender-PDF-Importer_*.zip
            dist/release-candidate-provenance.json

      - name: Retain attested release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            dist/Blender-PDF-Importer_*.zip
            dist/release-candidate-provenance.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && needs.release.result == 'success'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.build_ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download and verify exact attested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ needs.release.outputs.build_ref }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          CANDIDATE_ARTIFACT: ${{ needs.release.outputs.candidate_artifact }}
          CANDIDATE_ATTEMPT: ${{ needs.release.outputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          cp scripts/release_safety.py "$RUNNER_TEMP/release_safety.py"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CANDIDATE_ARTIFACT" --dir dist
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def strict_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate candidate JSON key: " + key)
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError("Non-finite candidate JSON: " + value)

          record = json.loads(
              Path("dist/release-candidate-provenance.json").read_text(encoding="utf-8"),
              object_pairs_hook=strict_pairs,
              parse_constant=reject_constant,
          )
          expected = {
              "schema": "bcs.blender_release_candidate/1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["BUILD_REF"],
              "workflow_sha": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["CANDIDATE_ATTEMPT"]),
              "version": os.environ["RELEASE_VERSION"],
          }
          if set(record) != set(expected) | {"artifact"}:
              raise SystemExit("Candidate provenance shape mismatch")
          if any(record[key] != value or type(record[key]) is not type(value)
                 for key, value in expected.items()):
              raise SystemExit("Candidate origin/version mismatch")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected["source_sha"]:
              raise SystemExit("Publisher checkout does not match candidate")
          archives = list(Path("dist").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit("Expected exactly one transferred ZIP")
          archive = archives[0]
          if archive.is_symlink() or not archive.is_file():
              raise SystemExit("Transferred ZIP is not an ordinary file")
          observed = {
              "name": archive.name,
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "size_bytes": archive.stat().st_size,
          }
          artifact = record["artifact"]
          if not isinstance(artifact, dict) or set(artifact) != set(observed):
              raise SystemExit("Candidate artifact shape mismatch")
          if any(artifact[key] != value or type(artifact[key]) is not type(value)
                 for key, value in observed.items()):
              raise SystemExit("Transferred ZIP bytes differ from attested candidate")
          PY
          for candidate in dist/*.zip dist/release-candidate-provenance.json; do
            gh attestation verify "$candidate" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/auto-release.yml" \
              --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

      - name: Complete or verify immutable release
        id: mint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTION="${{ needs.release.outputs.action }}"
          TAG="${{ needs.release.outputs.tag }}"
          RELEASE_TARGET="${{ needs.release.outputs.release_target }}"
          RELEASE_ID="${{ needs.release.outputs.release_id }}"
          TITLE="v${{ needs.release.outputs.version }} — PDF Vector Importer for Blender"
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          refresh_release() {
            local attempt discovery
            for attempt in 1 2 3 4 5; do
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
              discovery="$(python "$RUNNER_TEMP/release_safety.py" discover-release \
                --releases-json "$RUNNER_TEMP/releases.json" --tag "$TAG")"
              RELEASE_STATE="$(printf '%s' "$discovery" | jq -r .release_state)"
              RELEASE_ID="$(printf '%s' "$discovery" | jq -r .release_id)"
              if [ -n "$RELEASE_ID" ]; then
                gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RELEASE_JSON"
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 2))
              fi
            done
            echo "Release $TAG did not become visible after five attempts." >&2
            return 1
          }
          shopt -s nullglob
          ASSETS=(dist/*.zip)
          if [ "${#ASSETS[@]}" -ne 1 ]; then
            echo "Expected exactly one release ZIP; found ${#ASSETS[@]}" >&2
            exit 1
          fi
          ASSET="${ASSETS[0]}"

          if [ "$ACTION" = "verify_existing_release" ]; then
            test -n "$RELEASE_ID"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RELEASE_JSON"
            python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
              --release-json "$RELEASE_JSON" --asset "$ASSET" \
              --output "$RUNNER_TEMP/verified-release-assets.json"
            jq -e ".draft == false" "$RELEASE_JSON" >/dev/null
            jq -e ".immutable == true" "$RELEASE_JSON" >/dev/null
            echo "minted=false" >> "$GITHUB_OUTPUT"
            python "$RUNNER_TEMP/release_safety.py" audit-existing-tag \
              --repo "${GITHUB_REPOSITORY}" \
              --tag "$TAG" \
              --before "${{ github.event.before }}" \
              --head "$GITHUB_SHA" \
              --session-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --mode release \
              --summary "$GITHUB_STEP_SUMMARY" \
              --warnings-file .release-safety/warnings.json
            exit 0
          fi

          if [ "$ACTION" = "mint_new_tag" ]; then
            git tag "$TAG" "$RELEASE_TARGET"
            if ! git push origin "refs/tags/${TAG}"; then
              git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
              test "$(git rev-list -n 1 "$TAG^{commit}")" = "$RELEASE_TARGET"
            fi
          fi

          if [ "$ACTION" != "complete_draft_release" ]; then
            if ! gh release create "$TAG" --verify-tag --target "$RELEASE_TARGET" --title "$TITLE" --generate-notes --draft; then
              refresh_release
              if jq -e ".draft == false" "$RELEASE_JSON" >/dev/null; then
                python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
                  --release-json "$RELEASE_JSON" --asset "$ASSET" \
                  --output "$RUNNER_TEMP/verified-raced-release-assets.json"
                jq -e ".immutable == true" "$RELEASE_JSON" >/dev/null
                echo "minted=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              jq -e ".draft == true" "$RELEASE_JSON" >/dev/null
            else
              refresh_release
            fi
          fi

          refresh_release
          jq -e ".draft == true" "$RELEASE_JSON" >/dev/null
          ASSET_NAME="$(basename "$ASSET")"
          ASSET_COUNT="$(jq --arg name "$ASSET_NAME" '[.assets[] | select(.name == $name)] | length' "$RELEASE_JSON")"
          if [ "$ASSET_COUNT" = "0" ]; then
            if ! gh release upload "$TAG" "$ASSET"; then
              refresh_release
              python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
                --release-json "$RELEASE_JSON" --asset "$ASSET" \
                --output "$RUNNER_TEMP/verified-raced-upload-assets.json"
            fi
          elif [ "$ASSET_COUNT" != "1" ]; then
            echo "Release contains duplicate assets named ${ASSET_NAME}" >&2
            exit 1
          fi

          refresh_release
          python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
            --release-json "$RELEASE_JSON" --asset "$ASSET" \
            --output "$RUNNER_TEMP/verified-release-assets.json"
          if ! gh release edit "$TAG" --draft=false --latest; then
            refresh_release
            jq -e ".draft == false" "$RELEASE_JSON" >/dev/null
          fi
          refresh_release
          jq -e ".draft == false" "$RELEASE_JSON" >/dev/null
          jq -e ".immutable == true" "$RELEASE_JSON" >/dev/null
          python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
            --release-json "$RELEASE_JSON" --asset "$ASSET" \
            --output "$RUNNER_TEMP/verified-published-assets.json"
          echo "minted=true" >> "$GITHUB_OUTPUT"

      - name: Check website dispatch token secret
        if: steps.mint.outputs.minted == 'true'
        id: website_dispatch_token
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch website release update
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
          script: |
            const tag = 'v${{ needs.release.outputs.version }}';
            const payload = {
              source_repo: context.repo.owner + '/' + context.repo.repo,
              source_event: 'auto-release',
              source_ref: context.ref,
              source_sha: context.sha,
              release_tag: tag,
              release_name: tag,
              release_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
            };

            await github.request('POST /repos/{owner}/{repo}/dispatches', {
              owner: 'BlueCollar-Systems',
              repo: 'BlueCollar-Website',
              event_type: 'product-release',
              client_payload: payload,
            });

            core.info('Dispatched product-release to BlueCollar-Website');

      - name: Warn when website dispatch token is missing
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token != 'true'
        run: |
          echo "::warning::Skipping website dispatch because no valid dispatch token secret is configured."
          echo "Set WEBSITE_DISPATCH_TOKEN (or BLUECOLLAR_WEBSITE_DISPATCH_TOKEN / REPO_DISPATCH_TOKEN) to enable cross-repo dispatch."
